name: Build & Release

on:
  push:
    branches:
      - main
    paths:
      - "Cargo.toml"
      - "src/**"
  pull_request:
    paths:
      - "Cargo.toml"
      - "src/**"
  workflow_dispatch:

permissions:
  contents: read

env:
  CARGO_NET_GIT_FETCH_WITH_CLI: true

jobs:
  generate_version:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
      tag: ${{ steps.version.outputs.tag }}
    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Get version from Cargo.toml
        id: cargo_version
        run: |
          VERSION=$(grep '^version' Cargo.toml | head -1 | awk -F '"' '{print $2}')
          echo "cargo_version=$VERSION" >> $GITHUB_OUTPUT
          echo "📦 Found Cargo version: $VERSION"

      - name: Generate build version with metadata
        id: version
        run: |
          BUILD_NUMBER=$(git rev-list --count HEAD)
          CARGO_VERSION="${{ steps.cargo_version.outputs.cargo_version }}"
          FULL_VERSION="${CARGO_VERSION}+build.${BUILD_NUMBER}"
          echo "version=$FULL_VERSION" >> $GITHUB_OUTPUT
          echo "tag=v${FULL_VERSION}" >> $GITHUB_OUTPUT
          echo "📦 Cargo.toml version: $CARGO_VERSION"
          echo "🔢 Git commit count: $BUILD_NUMBER"
          echo "✨ Generated version: $FULL_VERSION"
          echo "🏷️ Generated tag: v$FULL_VERSION"

  build:
    runs-on: ${{ matrix.platform.runner }}
    needs: generate_version
    strategy:
      fail-fast: false
      matrix:
        rust: [stable, "1.93.1"]
        platform:
          - runner: windows-latest
            target: x86_64-pc-windows-msvc
            label: windows-x86_64
            ext: dll
          - runner: macos-latest
            target: x86_64-apple-darwin
            label: macos-x86_64
            ext: dylib
          - runner: macos-latest
            target: aarch64-apple-darwin
            label: macos-aarch64
            ext: dylib
    env:
      RUSTUP_TOOLCHAIN: ${{ matrix.rust }}

    steps:
      - uses: actions/checkout@v5

      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: ${{ matrix.rust }}
          targets: ${{ matrix.platform.target }}

      - uses: swatinem/rust-cache@v2
        with:
          key: ${{ matrix.rust }}

      - name: Build target
        run: cargo build --release --target ${{ matrix.platform.target }}

      - name: Rename output files (Windows)
        if: matrix.platform.runner == 'windows-latest'
        shell: pwsh
        run: |
          cd target/${{ matrix.platform.target }}/release/
          Get-ChildItem -Filter "*.${{ matrix.platform.ext }}" | ForEach-Object {
            $newName = "meme-emoji-${{ matrix.platform.label }}-${{ matrix.rust }}" + $_.Extension
            Rename-Item $_.Name $newName
            Write-Host "Renamed to: $newName"
          }

      - name: Rename output files (Unix)
        if: matrix.platform.runner != 'windows-latest'
        run: |
          cd target/${{ matrix.platform.target }}/release/
          for file in *.${{ matrix.platform.ext }}; do
            if [ -f "$file" ]; then
              new_name="meme-emoji-${{ matrix.platform.label }}-${{ matrix.rust }}.${file##*.}"
              mv "$file" "$new_name"
              echo "Renamed to: $new_name"
            fi
          done

      - uses: actions/upload-artifact@v6
        with:
          name: "meme-emoji-${{ matrix.platform.label }}-${{ matrix.rust }}"
          path: |
            target/${{ matrix.platform.target }}/release/meme-emoji-${{ matrix.platform.label }}-${{ matrix.rust }}.*

  build_linux:
    runs-on: ${{ matrix.platform.runner }}
    container: ${{ matrix.platform.container }}
    needs: generate_version
    strategy:
      fail-fast: false
      matrix:
        rust: [stable, "1.93.1"]
        platform:
          - runner: ubuntu-latest
            container: ghcr.io/memecrafters/meme-generator-build-container:latest
            target: x86_64-unknown-linux-gnu
            label: linux-x86_64
            ext: so
          - runner: ubuntu-24.04-arm
            container: ghcr.io/memecrafters/meme-generator-build-container:arm64
            target: aarch64-unknown-linux-gnu
            label: linux-aarch64
            ext: so
    env:
      RUSTUP_TOOLCHAIN: ${{ matrix.rust }}

    steps:
      - uses: actions/checkout@v5

      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: ${{ matrix.rust }}
          targets: ${{ matrix.platform.target }}

      - uses: swatinem/rust-cache@v2
        with:
          key: ${{ matrix.rust }}

      - name: Build target
        run: cargo build --release --target ${{ matrix.platform.target }}

      - name: Rename output files
        run: |
          cd target/${{ matrix.platform.target }}/release/
          for file in *.${{ matrix.platform.ext }}; do
            if [ -f "$file" ]; then
              new_name="meme-emoji-${{ matrix.platform.label }}-${{ matrix.rust }}.${file##*.}"
              mv "$file" "$new_name"
              echo "Renamed to: $new_name"
            fi
          done

      - uses: actions/upload-artifact@v6
        with:
          name: "meme-emoji-${{ matrix.platform.label }}-${{ matrix.rust }}"
          path: |
            target/${{ matrix.platform.target }}/release/meme-emoji-${{ matrix.platform.label }}-${{ matrix.rust }}.*

  build_android:
    runs-on: ${{ matrix.platform.runner }}
    container: ${{ matrix.platform.container }}
    needs: generate_version
    strategy:
      fail-fast: false
      matrix:
        rust: [stable, "1.93.1"]
        platform:
          - runner: ubuntu-latest
            container: ghcr.io/memecrafters/meme-generator-build-container:android
            target: aarch64-linux-android
            label: android-aarch64
            ext: so
    env:
      RUSTUP_TOOLCHAIN: ${{ matrix.rust }}

    steps:
      - uses: actions/checkout@v5

      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: ${{ matrix.rust }}
          targets: ${{ matrix.platform.target }}

      - uses: swatinem/rust-cache@v2
        with:
          key: ${{ matrix.rust }}

      - name: Build target
        run: cargo build --release --target ${{ matrix.platform.target }}

      - name: Rename output files
        run: |
          cd target/${{ matrix.platform.target }}/release/
          for file in *.${{ matrix.platform.ext }}; do
            if [ -f "$file" ]; then
              new_name="meme-emoji-${{ matrix.platform.label }}-${{ matrix.rust }}.${file##*.}"
              mv "$file" "$new_name"
              echo "Renamed to: $new_name"
            fi
          done

      - uses: actions/upload-artifact@v6
        with:
          name: "meme-emoji-${{ matrix.platform.label }}-${{ matrix.rust }}"
          path: |
            target/${{ matrix.platform.target }}/release/meme-emoji-${{ matrix.platform.label }}-${{ matrix.rust }}.*

  release:
    name: Create Release
    needs: [generate_version, build, build_linux, build_android]
    runs-on: ubuntu-latest
    if: |
      (github.event_name == 'push' && github.ref == 'refs/heads/main') ||
      github.event_name == 'workflow_dispatch'
    permissions:
      contents: write

    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Download all artifacts
        uses: actions/download-artifact@v8
        with:
          path: artifacts

      - name: List all downloaded files
        run: |
          echo "📂 Downloaded artifacts:"
          find artifacts -type f | sort

      - name: Generate release notes
        id: notes
        run: |
          TAG="${{ needs.generate_version.outputs.tag }}"
          VERSION="${{ needs.generate_version.outputs.version }}"
          REPO="${{ github.repository }}"
          REPO_NAME="${REPO##*/}"
          SGT=$(TZ=Asia/Singapore date '+%Y-%m-%d %H:%M:%S' 2>/dev/null || TZ=UTC-8 date '+%Y-%m-%d %H:%M:%S')
          TAG_URL=$(printf '%s' "$TAG" | sed 's/+/%2B/g')

          git fetch --tags --force || true

          # 上一版本 tag（按创建时间倒序取第二个）
          PREV_TAG=$(git tag --sort=-creatordate | grep -v -x "$TAG" | head -1 || true)

          # 提交清单
          if [ -n "$PREV_TAG" ]; then
            COMMITS=$(git log --pretty=format:'- %s (%h)' "${PREV_TAG}..HEAD")
          else
            COMMITS=$(git log --pretty=format:'- %s (%h)' -n 20)
          fi
          COUNT=$(printf '%s\n' "$COMMITS" | grep -c '^- ' || true)
          if [ "$COUNT" -eq 0 ]; then
            printf '%s\n' "- 无新增提交" > /tmp/commits.md
          elif [ "$COUNT" -gt 30 ]; then
            {
              printf '<details>\n<summary>共 %s 条提交</summary>\n\n' "$COUNT"
              printf '%s\n' "$COMMITS"
              printf '\n</details>\n'
            } > /tmp/commits.md
          else
            printf '%s\n' "$COMMITS" > /tmp/commits.md
          fi

          # 扫描产物，按 label + rust 版本归类
          declare -A FILES
          LABELS=""
          for f in $(find artifacts -type f | sort); do
            base=$(basename "$f")
            stem="${base%.*}"
            rust="${stem##*-}"
            label="${stem%-*}"
            label="${label#${REPO_NAME}-}"
            case "$rust" in
              stable|1.93.1) ;;
              *) continue ;;
            esac
            FILES["${label}|${rust}"]="$base"
            case " ${LABELS} " in
              *" ${label} "*) ;;
              *) LABELS="${LABELS} ${label}" ;;
            esac
          done

          # 固定展示顺序，未列出的 label 追加在末尾
          ORDER="windows-x86_64 macos-x86_64 macos-aarch64 linux-x86_64 linux-aarch64 android-aarch64"
          ORDERED=""
          for l in ${ORDER}; do
            case " ${LABELS} " in *" ${l} "*) ORDERED="${ORDERED} ${l}" ;; esac
          done
          for l in ${LABELS}; do
            case " ${ORDERED} " in *" ${l} "*) ;; *) ORDERED="${ORDERED} ${l}" ;; esac
          done

          display_name() {
            case "$1" in
              windows-x86_64) echo "Windows x64" ;;
              macos-x86_64) echo "macOS Intel" ;;
              macos-aarch64) echo "macOS Apple Silicon" ;;
              linux-x86_64) echo "Linux x64" ;;
              linux-aarch64) echo "Linux ARM64" ;;
              android-aarch64) echo "Android ARM64" ;;
              *) echo "$1" ;;
            esac
          }

          # 下载表格（文件名自动跟随构建矩阵）
          TABLE="| 平台 | stable | 1.93.1 |\n| --- | --- | --- |\n"
          for l in ${ORDERED}; do
            cell_s="${FILES[${l}|stable]:-}"
            cell_o="${FILES[${l}|1.93.1]:-}"
            if [ -n "$cell_s" ]; then
              cell_s="[${cell_s}](https://github.com/${REPO}/releases/download/${TAG_URL}/${cell_s})"
            else
              cell_s="—"
            fi
            if [ -n "$cell_o" ]; then
              cell_o="[${cell_o}](https://github.com/${REPO}/releases/download/${TAG_URL}/${cell_o})"
            else
              cell_o="—"
            fi
            TABLE="${TABLE}| $(display_name "$l") | ${cell_s} | ${cell_o} |\n"
          done

          # 完整差异链接
          if [ -n "$PREV_TAG" ]; then
            PREV_URL=$(printf '%s' "$PREV_TAG" | sed 's/+/%2B/g')
            DIFF="查看 [${PREV_TAG} → ${TAG}](https://github.com/${REPO}/compare/${PREV_URL}...${TAG_URL}) 的完整差异"
          else
            DIFF="首次发布，暂无上一版本可对比"
          fi

          {
            echo "## 选择下载"
            echo
            echo "按你的 meme-generator 主程序编译时所用的 Rust 版本选择对应一列。"
            echo
            printf '%b' "${TABLE}"
            echo "## 本次更新"
            echo
            cat /tmp/commits.md
            echo
            echo "${DIFF}"
            echo
            echo "## 构建信息"
            echo
            echo "- 版本: \`${VERSION}\`"
            echo "- 发布时间: ${SGT}（SGT，UTC+8）"
            echo "- 版本号格式: \`{Cargo版本}+build.{构建号}\`，构建号基于 Git 提交次数自动生成"
          } > /tmp/release_body.md

          echo "📝 Release body:"
          cat /tmp/release_body.md

      - name: Display version info
        run: |
          echo "🎯 Creating release with:"
          echo "   Version: ${{ needs.generate_version.outputs.version }}"
          echo "   Tag: ${{ needs.generate_version.outputs.tag }}"

      - name: Create Release
        id: create_release
        uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ needs.generate_version.outputs.tag }}
          name: Release ${{ needs.generate_version.outputs.version }}
          draft: false
          prerelease: false
          generate_release_notes: false
          body_path: /tmp/release_body.md
          files: |
            artifacts/**/meme-emoji-windows-x86_64-*.*
            artifacts/**/meme-emoji-macos-x86_64-*.*
            artifacts/**/meme-emoji-macos-aarch64-*.*
            artifacts/**/meme-emoji-linux-x86_64-*.*
            artifacts/**/meme-emoji-linux-aarch64-*.*
            artifacts/**/meme-emoji-android-aarch64-*.*