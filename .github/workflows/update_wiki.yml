name: Update wiki

on:
  push:
    branches:
      - main
    paths:
      # 表情实现与模块列表
      - "src/**"
      # 表情素材（新增/替换预览图依赖它）
      - "resources/**"
      # 版本号变化也应刷新 wiki
      - "Cargo.toml"
  workflow_dispatch:

# 同一时间只允许一个 wiki 更新任务，避免并发推送互相覆盖
concurrency:
  group: update-wiki-${{ github.repository }}
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  update-wiki:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout current repo
        uses: actions/checkout@v5

      - name: Checkout wiki repo
        uses: actions/checkout@v5
        with:
          repository: ${{ github.repository }}.wiki
          path: wiki

      - name: Checkout upstream repo
        uses: actions/checkout@v5
        with:
          repository: MemeCrafters/meme-generator-rs
          path: main

      # 与 ci-build-release 保持一致，避免工具链版本差异导致编译失败
      - uses: dtolnay/rust-toolchain@1.93.1

      - uses: swatinem/rust-cache@v2

      - name: Setup python
        uses: actions/setup-python@v6
        with:
          python-version: "3.10"

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libfontconfig1-dev libfreetype6-dev

      # 统一取新加坡标准时间（SGT，UTC+8）用于文档与提交信息
      - name: Get SGT time
        id: time
        run: |
          if TZ=Asia/Singapore date >/dev/null 2>&1; then
            SGT=$(TZ=Asia/Singapore date '+%Y-%m-%d %H:%M:%S')
          else
            SGT=$(TZ=UTC-8 date '+%Y-%m-%d %H:%M:%S')
          fi
          echo "sgt=$SGT" >> "$GITHUB_OUTPUT"
          echo "🕐 更新时间（SGT，UTC+8）：$SGT"

      - name: Update 表情列表.md
        env:
          UPDATE_TIME: ${{ steps.time.outputs.sgt }}
        run: |
          pip install virtualenv maturin[patchelf]
          cd main/meme_generator_py
          virtualenv .venv
          maturin develop --release
          source .venv/bin/activate
          pip install filetype pillow
          cd ../..
          cargo build --release
          mkdir libraries
          cp target/release/libmeme_emoji.so libraries/
          cp -r main/resources/fonts resources/
          echo -e "[meme]\nload_builtin_memes = false\nload_external_memes = true\n" > config.toml
          export MEME_HOME=.
          python wiki/scripts/update_meme_list.py

      - name: Commit & Push changes
        env:
          UPDATE_TIME: ${{ steps.time.outputs.sgt }}
        run: |
          cd wiki
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "✅ wiki 无变更，跳过提交"
            exit 0
          fi
          git commit -m "更新表情列表 - $UPDATE_TIME（SGT）"
          git push origin HEAD:master
